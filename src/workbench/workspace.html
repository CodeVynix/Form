<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Form Workspace</title>
<style>
  :root{--bg:#0e0e0e;--panel:#181818;--panel-2:#1e1e1e;--border:#242424;--border-2:#2a2a2a;--accent:#007acc;--text:#d4d4d4;--muted:#8a8a8a;--muted-2:#5e5e5e}
  *{box-sizing:border-box;margin:0}
  body{display:flex;height:100vh;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
  #explorer{width:240px;background:var(--panel);border-right:1px solid var(--border);padding:10px 8px;overflow:auto}
  #explorer h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px}
  #editor{flex:1;background:#121212;padding:14px;overflow:auto;display:flex;flex-direction:column;gap:10px}
  #explorer #workspaceLabel{color:var(--text);font-weight:600;font-size:12px}
  /* Agent — Cursor composer style */
  #agent{width:360px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
  .agent-tabs{display:flex;align-items:center;gap:4px;padding:6px 6px 0 6px;border-bottom:1px solid var(--border);background:var(--panel)}
  .tab{padding:6px 10px;font-size:12px;font-weight:500;border-radius:6px 6px 0 0;border:1px solid transparent;border-bottom:0;background:transparent;color:var(--muted);cursor:pointer}
  .tab.active{background:var(--panel-2);border-color:var(--border);color:var(--text)}
  .tab:hover{color:var(--text)}
  .tabs-spacer{flex:1}
  .icon-btn{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-size:13px}
  .icon-btn:hover{background:var(--panel-2);border-color:var(--border);color:var(--text)}
  #chat{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
  .msg{padding:7px 9px;border-radius:8px;max-width:100%;white-space:pre-wrap;font-size:12.5px;line-height:1.45}
  .msg.user{background:rgba(0,122,204,.14);border:1px solid rgba(0,122,204,.22);align-self:flex-end;color:#e6f0ff}
  .msg.agent{background:var(--panel-2);border:1px solid var(--border)}
  .msg .meta{font-size:10.5px;color:var(--muted-2);margin-bottom:3px}
  /* Composer — tight rhythm */
  .composer-wrap{padding:8px;background:var(--panel-2);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
  .composer{display:flex;align-items:flex-end;gap:6px;background:#141414;border:1px solid var(--border);border-radius:10px;padding:6px 6px 6px 10px;transition:border-color .12s}
  .composer:focus-within{border-color:var(--accent)}
  .composer textarea{flex:1;resize:none;background:transparent;border:0;outline:0;color:var(--text);font-size:12.8px;line-height:1.4;min-height:22px;max-height:88px;padding:2px 0}
  .composer textarea::placeholder{color:var(--muted-2)}
  .composer-actions{display:flex;align-items:center;gap:4px;flex-shrink:0}
  .composer-actions .icon-btn{width:24px;height:24px;font-size:12px;background:#232323;border-color:var(--border)}
  .composer-actions .icon-btn:hover{background:#2a2a2a}
  .send-btn{width:26px;height:26px;border-radius:8px;border:0;background:var(--accent);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s}
  .send-btn:hover{background:#0e8ed6}
  .send-btn:disabled{opacity:.45;cursor:default}
  .quick-row{display:flex;align-items:center;gap:6px}
  .pill-select{appearance:none;padding:4px 20px 4px 8px;font-size:11px;font-weight:500;border-radius:999px;border:1px solid var(--border);background:#232323;color:var(--muted);cursor:pointer;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background-image:linear-gradient(45deg, transparent 50%, var(--muted) 50%),linear-gradient(135deg, var(--muted) 50%, transparent 50%);background-position:calc(100% - 12px) calc(50% - 2px), calc(100% - 8px) calc(50% - 2px);background-size:4px 4px,4px 4px;background-repeat:no-repeat}
  .pill-select:hover{border-color:var(--border-2);color:var(--text)}
  .pill-select:focus{outline:0;border-color:var(--accent)}
  .pill-muted{font-size:10.5px;color:var(--muted-2);padding:2px 6px}
  .diff{background:#141414;border:1px solid var(--accent);border-radius:8px;padding:8px;margin-top:6px}
  .diff .actions{margin-top:6px;display:flex;gap:6px}
  .pill{font-size:10.5px;padding:2px 6px;background:#2a2a2a;border:1px solid var(--border);border-radius:999px}
  #settingsPanel{padding:8px;border-top:1px solid var(--border);max-height:48%;overflow:auto;background:var(--panel);display:none}
  #settingsPanel.visible{display:block}
</style>
</head>
<body>
  <div id="explorer">
    <h3>Explorer</h3>
    <div id="fileTree" style="font-size:12.5px;color:var(--muted)">(File tree — Code-OSS explorer in full build)<br><br>
      <div id="workspaceLabel"></div>
    </div>
  </div>
  <div id="editor">
    <div style="color:var(--muted);font-size:11px;margin-bottom:0">Editor — Monaco (Code-OSS) in full build</div>
    <div id="monacoStub" style="background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;font-family:Consolas,monospace;font-size:12.5px;min-height:220px;flex:1">Open a file from the explorer to edit.<br><br>Agent diff previews appear here with Accept/Reject.</div>
  </div>
  <div id="agent">
    <!-- Tab strip — Cursor style -->
    <div class="agent-tabs" role="tablist">
      <button class="tab active" role="tab" aria-selected="true">Agent</button>
      <button class="tab" id="newSessionBtn" title="New session">+</button>
      <div class="tabs-spacer"></div>
      <button id="settingsBtn" class="icon-btn" title="BYOK & settings">⚙</button>
      <!-- keep hidden providerSelect for compat, quickModel is primary -->
      <select id="providerSelect" style="display:none"></select>
      <span id="modelBadge" style="display:none"></span>
    </div>

    <div id="chat"></div>

    <!-- Composer — tight -->
    <div class="composer-wrap">
      <div class="composer">
        <textarea id="prompt" rows="1" placeholder="Plan, build, / for commands, @ for context"></textarea>
        <div class="composer-actions">
          <button id="attachBtn" class="icon-btn" title="Attach context (@)" type="button">＠</button>
          <button id="sendBtn" class="send-btn" type="button" title="Send">↑</button>
        </div>
      </div>
      <div class="quick-row">
        <select id="quickMode" class="pill-select" title="Mode">
          <option>Agent</option>
          <option>Ask</option>
          <option>Plan</option>
          <option>Build</option>
        </select>
        <select id="quickModel" class="pill-select" title="Model — quick switch"><option>no model</option></select>
        <span id="quickModelHint" class="pill-muted"></span>
      </div>
    </div>

    <div id="settingsPanel">
      <h4 style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">BYOK Providers</h4>
      <div id="providerList"></div>
      <div style="font-size:11px;color:var(--muted-2);margin-top:6px">/</div>
    </div>
  </div>
<script>
  const folder = new URLSearchParams(location.search).get('folder') || '(no folder)';
  document.getElementById('workspaceLabel').textContent = folder;

  // Tabs: new session clears chat
  document.getElementById('newSessionBtn').addEventListener('click', ()=>{ document.getElementById('chat').innerHTML=''; document.getElementById('prompt').value=''; });
  // Attach button hints @
  document.getElementById('attachBtn').addEventListener('click', ()=>{
    const ta=document.getElementById('prompt'); const pos=ta.selectionStart||0; const v=ta.value; ta.value=v.slice(0,pos)+'@'+v.slice(pos); ta.focus();
  });

  // Provider quick-switch pills + gear panel
  async function loadProviders(){
    const api = window.form;
    if(!api) return;
    const providers = await api.getProviders();
    const sel = document.getElementById('providerSelect');
    sel.innerHTML = '';
    providers.forEach(p=>{
      const o=document.createElement('option');
      o.value=p.id; o.textContent = `${p.displayName}${p.model?' — '+p.model:''}${p.enabled?'':' (disabled)'}`;
      sel.appendChild(o);
    });
    const active = await api.getActiveModel();
    if(active && active.providerId) sel.value = active.providerId;
    const badge = document.getElementById('modelBadge');
    badge.textContent = active && active.model ? `${active.model} via ${active.providerId}` : 'no model';

    // Quick model pill: list current provider’s models + active model
    const qModel = document.getElementById('quickModel');
    const hint = document.getElementById('quickModelHint');
    qModel.innerHTML='';
    // add placeholder
    if (!providers.length) { qModel.innerHTML='<option>no model</option>'; hint.textContent=''; }
    else {
      // collect distinct models known
      const opts = [];
      providers.forEach(p=>{
        if (p.model) opts.push({id:p.model, label:`${p.model} · ${p.displayName}`, provider:p.id});
      });
      if (active && active.model) {
        const exists = opts.some(o=>o.id===active.model);
        if (!exists) opts.unshift({id:active.model, label:`${active.model} · ${active.providerId}`, provider:active.providerId});
      }
      if (opts.length===0) opts.push({id:'', label:'no model', provider:''});
      opts.forEach(o=>{
        const el=document.createElement('option');
        el.value=o.id; el.dataset.provider=o.provider; el.textContent=o.label;
        if (active && o.id===active.model) el.selected=true;
        qModel.appendChild(el);
      });
      hint.textContent = active && active.providerId ? `via ${active.providerId}` : '';
    }

    const list=document.getElementById('providerList');
    list.innerHTML = providers.map(p=>`
      <div style="border:1px solid var(--border);padding:8px;border-radius:8px;margin-bottom:6px;background:var(--panel-2)">
        <div style="font-size:12.5px;font-weight:600">${p.displayName} <span style="font-weight:400;color:var(--muted)">${p.id}</span></div>
        ${p.id==='custom'||p.id==='local'?`<input data-id="${p.id}" data-field="baseUrl" placeholder="Base URL" value="${p.baseUrl||''}" style="width:100%;margin-top:6px;padding:6px;background:#141414;border:1px solid var(--border);color:var(--text);border-radius:6px" />`:''}
        ${p.id!=='local'?`<input data-id="${p.id}" data-field="apiKey" placeholder="API key" type="password" style="width:100%;margin-top:6px;padding:6px;background:#141414;border:1px solid var(--border);color:var(--text);border-radius:6px" />`:''}
        <div style="display:flex;gap:6px;margin-top:6px">
          <button onclick="fetchModelsFor('${p.id}')" style="padding:4px 8px;background:#2a2a2a;color:var(--muted);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:11px">Fetch models</button>
          <button onclick="saveProvider('${p.id}')" style="padding:4px 8px;background:var(--accent);color:#fff;border:0;border-radius:6px;cursor:pointer;font-size:11px">Save</button>
        </div>
        <div id="models-${p.id}" style="font-size:11px;color:var(--muted-2);margin-top:4px"></div>
      </div>
    `).join('');
  }
  async function fetchModelsFor(id){
    const baseUrl = document.querySelector(`input[data-id="${id}"][data-field="baseUrl"]`)?.value || undefined;
    const apiKey = document.querySelector(`input[data-id="${id}"][data-field="apiKey"]`)?.value || undefined;
    const el=document.getElementById('models-'+id);
    el.textContent='Fetching...';
    try{
      const models = await window.form.fetchModels(id, { baseUrl, apiKey });
      el.innerHTML = models.length ? models.map(m=>`<span class="pill" style="cursor:pointer" onclick="pickModel('${id}','${m.id}')">${m.id}</span>`).join(' ') : 'No models — use manual name.';
    }catch(e){ el.textContent = 'Fetch failed: '+e.message+' — use manual model name.'; }
  }
  async function saveProvider(id){
    const baseUrl = document.querySelector(`input[data-id="${id}"][data-field="baseUrl"]`)?.value || undefined;
    const plain = document.querySelector(`input[data-id="${id}"][data-field="apiKey"]`)?.value || undefined;
    await window.form.saveProvider({ id, displayName: id, baseUrl, enabled: true, _plainApiKey: plain });
    await loadProviders();
  }
  async function pickModel(providerId, model){
    await window.form.setActiveModel(providerId, model);
    await loadProviders();
  }
  document.getElementById('settingsBtn').onclick = ()=>{
    const p=document.getElementById('settingsPanel');
    p.classList.toggle('visible');
    if(p.classList.contains('visible')) loadProviders();
  };
  document.getElementById('providerSelect').onchange = async (e)=>{
    const id=e.target.value;
    const providers = await window.form.getProviders();
    const prov = providers.find(x=>x.id===id);
    if(prov && prov.model) await window.form.setActiveModel(id, prov.model);
    loadProviders();
  };
  // Quick model switch
  document.getElementById('quickModel').addEventListener('change', async (e)=>{
    const opt = e.target.selectedOptions[0];
    const model = opt.value;
    const provider = opt.dataset.provider;
    if (model && provider) { await window.form.setActiveModel(provider, model); await loadProviders(); }
  });
  document.getElementById('quickMode').addEventListener('change', (e)=>{
    // Mode is UI-only for now (Agent/Ask/Plan/Build) — could map to different prompts; keep for quick switching
    console.log('mode', e.target.value);
  });

  // Slash / @ hint handling
  const promptEl = document.getElementById('prompt');
  promptEl.addEventListener('keydown', (e)=>{
    if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('sendBtn').click(); }
  });
  promptEl.addEventListener('input', ()=>{
    const v=promptEl.value;
    // hint: if starts with / show command hint in quickModelHint
    const hint=document.getElementById('quickModelHint');
    if (v.startsWith('/')) hint.textContent = ' /plan /build /explain /fix';
    else if (v.includes('@')) hint.textContent = ' @file @folder';
    else {
      // restore provider hint
      window.form && window.form.getActiveModel().then(a=>{ hint.textContent = a && a.providerId ? `via ${a.providerId}` : ''; });
    }
    // auto-resize
    promptEl.style.height='auto';
    promptEl.style.height=Math.min(88, promptEl.scrollHeight)+'px';
  });

  // Chat
  let serverUrl = null;
  async function ensureServer(){
    if(serverUrl) return serverUrl;
    const res = await window.form.getServerUrl(folder);
    if(res && res.error){ addMsg('agent', 'OpenCode server error: '+res.error+'\nIs `opencode` on PATH? Install from https://opencode.ai', 'system'); return null; }
    serverUrl = typeof res==='string'?res:res.url||res;
    return serverUrl;
  }
  function addMsg(role, text, meta){
    const c=document.getElementById('chat');
    const d=document.createElement('div');
    d.className='msg '+(role==='user'?'user':'agent');
    d.innerHTML = (meta?`<div class="meta">${meta}</div>`:'') + text.replace(/</g,'&lt;');
    c.appendChild(d); c.scrollTop=c.scrollHeight;
  }
  document.getElementById('sendBtn').onclick = async ()=>{
    const prompt=document.getElementById('prompt').value.trim();
    if(!prompt) return;
    addMsg('user', prompt);
    document.getElementById('prompt').value='';
    promptEl.style.height='auto';
    const url = await ensureServer();
    if(!url){ addMsg('agent','No OpenCode server — configure provider first.', 'error'); return; }
    const active = await window.form.getActiveModel();
    const modelLabel = active && active.model ? `${active.model} via ${active.providerId}` : 'default model';
    addMsg('agent','…waiting for '+modelLabel+'…', modelLabel);
    try{
      const res = await fetch(`${url}/session`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ prompt, model: active?.model }) });
      if(!res.ok) throw new Error('HTTP '+res.status);
      const text = await res.text();
      const last = document.getElementById('chat').lastElementChild;
      if(last) last.innerHTML = `<div class="meta">${modelLabel}</div>${text.slice(0,4000).replace(/</g,'&lt;')}`;
      if(text.includes('diff')||text.includes('patch')){
        const diff=document.createElement('div');
        diff.className='diff';
        diff.innerHTML = `<div style="font-size:11px;color:var(--accent)">Diff preview</div><pre style="font-size:11px;white-space:pre-wrap">${text.slice(0,2000).replace(/</g,'&lt;')}</pre><div class="actions"><button style="background:var(--accent);color:#fff;border:0;padding:4px 10px;border-radius:6px;cursor:pointer" onclick="this.closest('.diff').remove();addMsg('agent','Accepted.','system')">Accept</button><button style="background:#2a2a2a;color:var(--muted);border:1px solid var(--border);padding:4px 10px;border-radius:6px;cursor:pointer" onclick="this.closest('.diff').remove();addMsg('agent','Rejected.','system')">Reject</button></div>`;
        document.getElementById('chat').appendChild(diff);
      }
    }catch(e){
      const last=document.getElementById('chat').lastElementChild;
      if(last) last.innerHTML = `<div class="meta">error</div>Failed: ${e.message}. Check provider key, model, and that opencode serve is running.`;
    }
  };

  if(window.form) loadProviders();
  else window.addEventListener('DOMContentLoaded', loadProviders);
</script>
</body>
</html>
